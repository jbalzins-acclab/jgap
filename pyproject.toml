[build-system]
requires = ["scikit-build-core>=0.10.0", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "jgap"
version = "7.2.3"
description = "Gaussian Approximation Potentials (GAP) in C++23 with Python interface and ASE integration"
readme = "ReadMe.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Jegors Balzins" }]
keywords = ["molecular-dynamics", "machine-learning", "interatomic-potentials", "materials-science", "gaussian-approximation-potentials", "GAP", "ase", "tabGAP"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
dependencies = [
    "numpy>=1.20",
    "ase>=3.22",
]

[project.urls]
Homepage = "https://github.com/jbalzins-acclab/jgap/"
Repository = "https://github.com/jbalzins-acclab/jgap/"

[tool.scikit-build]
cmake.version = ">=3.25"
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
wheel.packages = ["python/jgap"]

[tool.scikit-build.sdist]
include = [
    "resources/**",
    "cmake/**",
    "src/**",
    "python/**",
    "CMakeLists.txt",
    "ReadMe.md",
    "LICENSE",
]

[tool.scikit-build.cmake.define]
JGAP_BUILD_TESTS = "OFF"
JGAP_BUILD_VALIDATION = "OFF"
CMAKE_CXX_FLAGS_RELEASE = "-O3 -ffast-math"

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_* *i686"
build-verbosity = 1

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "jgap-linux-builder"
environment = { CC = "gcc-15", CXX = "g++-15", AUDITWHEEL_PLAT = "manylinux_2_39_x86_64", LDFLAGS = "-static-libstdc++ -static-libgcc" }
repair-wheel-command = "auditwheel repair -v -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
archs = ["arm64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "14.0", CC = "/opt/homebrew/opt/llvm/bin/clang", CXX = "/opt/homebrew/opt/llvm/bin/clang++", CMAKE_PREFIX_PATH = "/opt/homebrew;/opt/homebrew/opt/llvm", LDFLAGS = "-L/opt/homebrew/opt/llvm/lib -Wl,-rpath,/opt/homebrew/opt/llvm/lib", CPPFLAGS = "-I/opt/homebrew/opt/llvm/include" }
repair-wheel-command = "env -u MACOSX_DEPLOYMENT_TARGET delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"
