name: CI / Build, Test & Validate

on:
  push:
    branches: [ main, master, documentation ]
  pull_request:
    branches: [ main, master, documentation ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-validate:
    name: Ubuntu 24.04 (GCC 15, C++23)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup ccache Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: ${{ runner.os }}-ccache-

      - name: Cache Python Virtualenv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: ~/venv
          key: ${{ runner.os }}-venv-v2-${{ hashFiles('pyproject.toml', '.github/workflows/ci.yml') }}

      - name: Install System Dependencies
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            gcc-15 \
            g++-15 \
            libhdf5-dev \
            libopenblas-dev \
            ccache \
            python3-dev \
            python3-venv \
            python3-pip

      - name: Set up Python Environment
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python3 -m venv $HOME/venv
          source $HOME/venv/bin/activate
          pip install --upgrade pip
          pip install pybind11 numpy scipy ase pandas elastic

      - name: 1. Release Build & Install (with Tests & Validation Targets)
        run: |
          source $HOME/venv/bin/activate
          cmake --preset release \
            -DCMAKE_C_COMPILER=gcc-15 \
            -DCMAKE_CXX_COMPILER=g++-15 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_INSTALL_PREFIX=$HOME/.local \
            -DJGAP_BUILD_TESTS=ON \
            -DJGAP_BUILD_VALIDATION=ON \
            -DPython3_EXECUTABLE=$HOME/venv/bin/python
          cmake --build --preset release
          cmake --build --preset install

      - name: 2. Run Unit Tests
        run: |
          source $HOME/venv/bin/activate
          ctest --preset release --output-on-failure

      - name: 3. Compile Standalone Examples (Without CMake)
        run: |
          source $HOME/venv/bin/activate
          export CPATH="$HOME/.local/include"
          export LIBRARY_PATH="$HOME/.local/lib"
          export LD_LIBRARY_PATH="$HOME/.local/lib:$LD_LIBRARY_PATH"

          echo "Compiling BasicFit... "
          g++-15 -std=c++23 -O3 -march=native examples/basic_fit/BasicFit.cpp -ljgap -o examples/basic_fit/basic_fit

          echo "Compiling StandardFit... "
          g++-15 -std=c++23 -O3 -march=native examples/standard_fit/StandardFit.cpp -ljgap -o examples/standard_fit/standard_fit

          echo "Compiling CustomFit... "
          g++-15 -std=c++23 -O3 -march=native examples/custom_fit/CustomFit.cpp -ljgap -o examples/custom_fit/custom_fit

          echo "Compiling CustomExperimentFit... "
          g++-15 -std=c++23 -O3 -march=native examples/custom_experiment_fit/CustomExperimentFit.cpp -ljgap -o examples/custom_experiment_fit/custom_experiment_fit

      - name: 4. End-to-End Examples Smoke Test
        run: |
          source $HOME/venv/bin/activate
          export LD_LIBRARY_PATH="$HOME/.local/lib:$LD_LIBRARY_PATH"
          PY_SITE=$(python3 -c "import sys; print(f'$HOME/.local/lib/python{sys.version_info.major}.{sys.version_info.minor}/site-packages')")
          export PYTHONPATH="$PY_SITE:$PYTHONPATH"

          echo "Running CustomExperimentFit... "
          ./examples/custom_experiment_fit/custom_experiment_fit \
            test/resources/structure-databases/db_Fe.xyz \
            fe_ci_test \
            --ram-limit 2.0

          echo "Running ASE integration evaluation... "
          python3 examples/ase_integration/test_potential_with_ase.py \
            fe_ci_test.tabgap.h5 \
            test/resources/structure-databases/db_Fe.xyz \
            --no-config-errors \
            --skip-bulk
