name: CI / Build, Test & Validate

on:
  push:
    branches: [ main, master, documentation ]
  pull_request:
    branches: [ main, master, documentation ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-validate:
    name: Ubuntu 24.04 (GCC 14, C++23)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            gcc-14 \
            g++-14 \
            libhdf5-dev \
            libopenblas-dev \
            libomp-14-dev \
            python3-dev \
            python3-venv \
            python3-pip

      - name: Set up Python Environment
        run: |
          python3 -m venv $HOME/venv
          source $HOME/venv/bin/activate
          pip install --upgrade pip
          pip install numpy scipy ase

      - name: 1. Release Build & Install
        run: |
          source $HOME/venv/bin/activate
          cmake --preset release \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_INSTALL_PREFIX=$HOME/.local \
            -DPython3_EXECUTABLE=$HOME/venv/bin/python
          cmake --build --preset install

      - name: 2. Build & Run Unit Tests
        run: |
          source $HOME/venv/bin/activate
          cmake --preset release-tests \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DPython3_EXECUTABLE=$HOME/venv/bin/python
          cmake --build --preset release-tests
          ctest --preset release --output-on-failure

      - name: 3. Build & Run Validation Suite
        run: |
          source $HOME/venv/bin/activate
          cmake --preset validation \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DPython3_EXECUTABLE=$HOME/venv/bin/python
          cmake --build --preset validation
          ctest --preset validation --output-on-failure

      - name: 4. Compile Standalone Examples (Without CMake)
        run: |
          source $HOME/venv/bin/activate
          export CPATH="$HOME/.local/include"
          export LIBRARY_PATH="$HOME/.local/lib"
          export LD_LIBRARY_PATH="$HOME/.local/lib:$LD_LIBRARY_PATH"

          echo "Compiling BasicFit..."
          g++-14 -std=c++23 -O3 -march=native examples/basic_fit/BasicFit.cpp -ljgap -o examples/basic_fit/basic_fit

          echo "Compiling StandardFit..."
          g++-14 -std=c++23 -O3 -march=native examples/standard_fit/StandardFit.cpp -ljgap -o examples/standard_fit/standard_fit

          echo "Compiling CustomFit..."
          g++-14 -std=c++23 -O3 -march=native examples/custom_fit/CustomFit.cpp -ljgap -o examples/custom_fit/custom_fit

          echo "Compiling CustomExperimentFit..."
          g++-14 -std=c++23 -O3 -march=native examples/custom_experiment_fit/CustomExperimentFit.cpp -ljgap -o examples/custom_experiment_fit/custom_experiment_fit

      - name: 5. End-to-End Examples Smoke Test
        run: |
          source $HOME/venv/bin/activate
          export LD_LIBRARY_PATH="$HOME/.local/lib:$LD_LIBRARY_PATH"
          export PYTHONPATH="$HOME/.local/lib/python3.12/site-packages:$HOME/.local/lib/python3/dist-packages:$PYTHONPATH"

          echo "Running CustomExperimentFit..."
          ./examples/custom_experiment_fit/custom_experiment_fit \
            test/resources/structure-databases/db_Fe.xyz \
            fe_ci_test \
            --ram-limit 2.0

          echo "Running ASE integration evaluation..."
          python3 examples/ase_integration/test_potetnial_with_ase.py \
            fe_ci_test.tabgap.h5 \
            test/resources/structure-databases/db_Fe.xyz \
            --no-config-errors \
            --skip-bulk
